name: Tessera
options:
  bundleIdPrefix: io.github.camponotus-vagus
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
packages:
  StitchKit:
    path: Packages/StitchKit
targets:
  Tessera:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: StitchKit
        product: StitchKit
    settings:
      base:
        PRODUCT_NAME: Tessera
        PRODUCT_BUNDLE_IDENTIFIER: io.github.camponotus-vagus.Tessera
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tessera
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Local development build: ad-hoc signed, no sandbox, no hardened runtime,
        # so the Homebrew OpenCV and ONNX Runtime dylibs load from /opt/homebrew.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
schemes:
  Tessera:
    build:
      targets:
        Tessera: all
    run:
      config: Debug
    archive:
      config: Release
